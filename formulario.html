<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Formulário de avaliação de produto do curso WDD 131 - envie sua opinião sobre o produto adquirido.">
  <meta name="author" content="Claudio">
  <title>Avaliação de Produto | WDD 131</title>
  <link rel="stylesheet" href="estilos/formulario.css">
</head>

<body>
  <header>
    <h1>Avaliação de Produto</h1>
  </header>

  <main>
    <form method="get" action="avaliacao.html" aria-labelledby="form-title">
      <h2 id="form-title">Conte sua experiência</h2>
      <p class="legenda-obrigatorio">Campos marcados com <span class="req">*</span> são obrigatórios.</p>

      <!-- Nome do produto: preenchido via JavaScript a partir do array de produtos -->
      <label for="product-name">
        Nome do Produto <span class="req">*</span>
        <select id="product-name" name="product-name" required>
          <option value="" disabled selected>Selecione um Produto...</option>
        </select>
      </label>

      <!-- Classificação geral: estrelas (radio), obrigatório -->
      <fieldset class="rating" id="rating">
        <legend>Classificação Geral <span class="req">*</span></legend>
        <div class="stars">
          <input type="radio" id="rating5" name="rating" value="5" required>
          <label for="rating5" aria-label="5 estrelas">★</label>
          <input type="radio" id="rating4" name="rating" value="4">
          <label for="rating4" aria-label="4 estrelas">★</label>
          <input type="radio" id="rating3" name="rating" value="3">
          <label for="rating3" aria-label="3 estrelas">★</label>
          <input type="radio" id="rating2" name="rating" value="2">
          <label for="rating2" aria-label="2 estrelas">★</label>
          <input type="radio" id="rating1" name="rating" value="1">
          <label for="rating1" aria-label="1 estrela">★</label>
        </div>
      </fieldset>

      <!-- Data de instalação: obrigatório -->
      <label for="install-date">
        Data de Instalação <span class="req">*</span>
        <input type="date" id="install-date" name="install-date" required>
      </label>

      <!-- Recursos úteis: checkboxes -->
      <fieldset class="features">
        <legend>Recursos Úteis</legend>
        <label><input type="checkbox" id="feature-durability" name="features" value="durabilidade"> Durabilidade</label>
        <label><input type="checkbox" id="feature-cost" name="features" value="custo-beneficio"> Custo-benefício</label>
        <label><input type="checkbox" id="feature-ease" name="features" value="facilidade-de-uso"> Facilidade de
          uso</label>
        <label><input type="checkbox" id="feature-features" name="features" value="funcionalidades">
          Funcionalidades</label>
        <label><input type="checkbox" id="feature-appearance" name="features" value="aparencia"> Aparência</label>
      </fieldset>

      <!-- Avaliação escrita -->
      <label for="review-text">
        Avaliação por escrito
        <textarea id="review-text" name="review-text" rows="5"
          placeholder="Escreva sua opinião sobre o produto…"></textarea>
      </label>

      <!-- Nome de quem avalia -->
      <label for="user-name">
        Seu nome
        <input type="text" id="user-name" name="user-name" autocomplete="name">
      </label>

      <input type="submit" value="Enviar Avaliação">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> · Claudio · WDD 131</p>
    <p id="lastModified"></p>
  </footer>

  <script src="scripts/formulario.js"></script>
</body>

</html>
