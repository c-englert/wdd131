<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="Formulário de avaliação de produto do curso WDD 131 - envie sua opinião sobre o produto adquirido.">
  <meta name="author" content="Claudio">
  <title>Avaliação de Produto | WDD 131</title>
  <link rel="stylesheet" href="estilos/formulario.css">
  <script src="scripts/formulario.js" defer></script>
</head>

<body>
  <header>
    <h1>Avaliação de Produto</h1>
  </header>

  <main>
    <form method="get" action="avaliacao.html" aria-labelledby="form-title">
      <h2 id="form-title">Conte sua experiência</h2>
      <p class="legenda-obrigatorio">Campos marcados com <span class="req">*</span> são obrigatórios.</p>

      <label for="product-name">
        Nome do Produto <span class="req">*</span>
        <select id="product-name" name="product-name" required>
          <option value="" disabled selected>Selecione um produto...</option>
        </select>
      </label>

      <fieldset class="rating">
        <legend>Classificação Geral <span class="req">*</span></legend>
        <div class="stars">
          <input type="radio" id="rating5" name="rating" value="5" required>
          <label for="rating5"><span class="visually-hidden">5 estrelas</span></label>
          <input type="radio" id="rating4" name="rating" value="4" required>
          <label for="rating4"><span class="visually-hidden">4 estrelas</span></label>
          <input type="radio" id="rating3" name="rating" value="3" required>
          <label for="rating3"><span class="visually-hidden">3 estrelas</span></label>
          <input type="radio" id="rating2" name="rating" value="2" required>
          <label for="rating2"><span class="visually-hidden">2 estrelas</span></label>
          <input type="radio" id="rating1" name="rating" value="1" required>
          <label for="rating1"><span class="visually-hidden">1 estrela</span></label>
        </div>
      </fieldset>

      <label for="install-date">
        Data de Instalação <span class="req">*</span>
        <input type="date" id="install-date" name="install-date" required>
      </label>

      <fieldset class="features">
        <legend>Recursos Úteis</legend>
        <div class="feature">
          <input type="checkbox" id="feature-durability" name="features" value="durabilidade">
          <label for="feature-durability">Durabilidade</label>
        </div>
        <div class="feature">
          <input type="checkbox" id="feature-cost" name="features" value="custo-beneficio">
          <label for="feature-cost">Custo-benefício</label>
        </div>
        <div class="feature">
          <input type="checkbox" id="feature-ease" name="features" value="facilidade-de-uso">
          <label for="feature-ease">Facilidade de uso</label>
        </div>
        <div class="feature">
          <input type="checkbox" id="feature-features" name="features" value="funcionalidades">
          <label for="feature-features">Funcionalidades</label>
        </div>
        <div class="feature">
          <input type="checkbox" id="feature-appearance" name="features" value="aparencia">
          <label for="feature-appearance">Aparência</label>
        </div>
      </fieldset>

      <label for="review-text">
        Avaliação por escrito
        <textarea id="review-text" name="review-text" rows="5"
          placeholder="Escreva sua opinião sobre o produto…"></textarea>
      </label>

      <!-- Nome de quem avalia -->
      <label for="user-name">
        Seu nome
        <input type="text" id="user-name" name="user-name" autocomplete="name">
      </label>

      <input type="submit" value="Enviar Avaliação">
    </form>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> · Claudio · WDD 131</p>
    <p id="lastModified"></p>
  </footer>
</body>

</html>
